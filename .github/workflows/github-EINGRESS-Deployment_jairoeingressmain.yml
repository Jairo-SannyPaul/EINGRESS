# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - jairoeingressmain

on:
  push:
    branches:
      - github-EINGRESS/Deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://jairoeingressregistry.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_17305e4245014fb8be6f36905d59a7d5 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_fa22d1ac3cf6464abf9bf0bf4fecea54 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: jairoeingressregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_17305e4245014fb8be6f36905d59a7d5 }}/eingress:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'jairoeingressmain'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_5974942a61244fad8d014355a825edbf }}
        images: 'jairoeingressregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_17305e4245014fb8be6f36905d59a7d5 }}/eingress:${{ github.sha }}'