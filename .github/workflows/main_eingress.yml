# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - jairoeingressmain

on:
  push:
    branches:
      - github-EINGRESS/main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: https://jairoeingressregistry.azurecr.io/
          username: ${{ secrets.AzureAppService_ContainerUsername_66292500dd74426797fb40bb912f4e7c }}
          password: ${{ secrets.AzureAppService_ContainerPassword_43bcea8f27ac447898f285961cf42d00 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: jairoeingressregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_66292500dd74426797fb40bb912f4e7c }}/eingress:${{ github.sha }}
          file: ./Dockerfile

    deploy:
      runs-on: ubuntu-latest
      needs: build
      environment:
        name: 'production'
        url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

      steps:
        - name: Deploy to Azure Web App
          id: deploy-to-webapp
          uses: azure/webapps-deploy@v2
          with:
            app-name: 'jairoeingressmain'
            slot-name: 'production'
            publish-profile: ${{ secrets.AzureAppService_PublishProfile_0d6df44bd7ee4767bfb37d481871179a }}
            images: 'jairoeingressregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_66292500dd74426797fb40bb912f4e7c }}/eingress:${{ github.sha }}'