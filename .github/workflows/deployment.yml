name: Build and deploy container app to Azure Web App - jairoeingressmain

on:
  push:
    branches:
      - github-EINGRESS/Deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: jairoeingressregistry.azurecr.io
          username: EINGRESS-ADMIN
          password: ${{ secrets.JAIROEINGRESSREGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: jairoeingressregistry.azurecr.io/eingress:main
          file: ./Dockerfile