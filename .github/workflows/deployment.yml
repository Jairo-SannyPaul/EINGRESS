name: Build and deploy container app to Azure Web App - jairoeingressmain

on:
  push:
    branches:
      - github-EINGRESS/Deployment
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: jairoeingressregistry.azurecr.io
          username: EINGRESS-ADMIN
          password: ${{ secrets.JAIROEINGRESSREGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: jairoeingressregistry.azurecr.io/eingress:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'jairoeingressmain'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_60c517cadc334baa8ecca0f1775771d8 }}
          images: 'jairoeingressregistry.azurecr.io/eingress:${{ github.sha }}'
