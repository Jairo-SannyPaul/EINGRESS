<div class="search" [class.active]="isFocused">
    <img src="/assets/images/search.png">
    <input type="text" name="user" 
           [placeholder]="isFocused ? '' : 'Search ' + selectedFilter" 
           (focus)="clearPlaceholder()" (blur)="restorePlaceholder()"
           [ngModel]="searchEmployee" (ngModelChange)="onSearchUserInputChanged()" 
           #searchInput>
</div>
