<div class="table">
    <div class="table-header"   [ngStyle]="{
        'grid-template-columns': deleteMode ? '20px 70px 1fr 400px repeat(3, 1fr) 36px' : '20px 34px 1fr 400px repeat(3, 1fr) 36px'
      }">
        <div class="checkbox-content"></div>
        <div class="user-header">Employee Name</div>
        <div class="role-header">Role</div>
        <div class="status-header" (click)="toggleShowStatus()">
            Status 
            <ng-container *ngIf="registered; else unregistered">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 6.75L12.75 10.5L5.25 10.5L9 6.75Z" fill="#464646"/>
              </svg>
            </ng-container>
            <ng-template #unregistered>
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 11.25L5.25 7.5H12.75L9 11.25Z" fill="#464646"/>
                    </svg>
            </ng-template>
            <div *ngIf="showStatusSelection" class="status-selection">
                <span (click)="toggleRegistered()">Registered</span>
                <span (click)="toggleUnregistered()">Unregistered</span>
              </div>
          </div>

        <div class="registered-date-header">Registered date</div>
        <div class="last-login-header">Last login</div>
    </div>

    <app-user-selection (employeeSelected)="onEmployeeSelected($event)" class="user-selection"></app-user-selection>
    <app-employee-details></app-employee-details>
</div>
