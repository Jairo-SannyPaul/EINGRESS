<div *ngIf="filteredEmployees && filteredEmployees.length > 0; else noMatch">
  <div *ngFor="let employee of filteredEmployees" class="user pointer">
    <div class="checkbox-content">
      <input type="checkbox" [(ngModel)]="employee.selected" change="toggleSelection(employee)">
    </div>
    <img [src]="baseUrl + '/profile-image/' + employee.profileImage" alt="Profile Image"
      [ngClass]="{'no-bio-border': !hasBio(employee), 'bio-border': hasBio(employee)}">
    <div class="employee-info-container" (click)="selectedEmployee(employee)">
      <div class="employee-fullname">{{ employee.fullname }}</div>
      <div class="role-content">{{ employee.role }}</div>
      <div class="registered-date-content">{{ employee.regdate }}</div>
      <div class="last-login-content">{{ employee.lastlogdate }}</div>
    </div>
  </div>
</div>

<ng-template #noMatch>
  <div class="no-match-container">
    <div class="no-match-icon">🔍</div>
    <div class="no-match-message">No matching results found</div>
  </div>
</ng-template>

<div [ngClass]="{'fade-out': !loading}" class="loading-overlay">
  <div class="jairo-container">
    <div class="jairoLoading">Jairosoft EINGRESS</div>
    <div class="spinner"></div>
  </div>
