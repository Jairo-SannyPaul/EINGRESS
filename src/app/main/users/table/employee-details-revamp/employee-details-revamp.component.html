<body>
    <div class="modal-overlay">
        <div class="modal-container">
            <div class = "header">
                <div class = "profile-picture"></div>
                <div class = "header-text">
                    <span class="header-title">Name goes Here</span>
                    <span class="header-subtitle">Email goes here</span>
                </div>
            <button class="close pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M6.4 19L5 17.6L10.6 12L5 6.4L6.4 5L12 10.6L17.6 5L19 6.4L13.4 12L19 17.6L17.6 19L12 13.4L6.4 19Z" fill="#464646"/>
                  </svg>
            </button>
            </div>
          <!-- Add your form or content here -->
            <div class = "modal-content">
                <!--start of left div-->
                <div class = "modal-content-left">
                    <div class = "name-container">
                        <p> Full Name</p>
                        <input type="text" id="addUserName" formControlName="fullname" name="fullname" placeholder="Input Full Name">
                     </div>
                     <div class = "role-container">
                        <p>Role</p>
                        <div class = "drop-down">
                            <select id="addRole" formControlName="role" name="roleDropDown">
                                <option value="" disabled selected>Select Role</option>
                                <option value="Admin Aide">Admin Aide</option>
                                <option value="Administrative Assistant">Administrative Assistant</option>
                                <option value="Administrative Officer">Administrative Officer</option>
                                <option value="Back End Developer">Back End Developer</option>
                                <option value="Bubble Developer">Bubble Developer</option>
                                <option value="CAD Operator">CAD Operator</option>
                                <option value="Cebu Branch Manager">Cebu Branch Manager</option>
                                <option value="Chief Executive Officer">Chief Executive Officer</option>
                                <option value="Chief Finance Officer">Chief Finance Officer</option>
                                <option value="Co-CEO">Co-CEO</option>
                                <option value="Database Administrator">Database Administrator</option>
                                <option value="Developer">Developer</option>
                                <option value="DevOps Engineer">DevOps Engineer</option>
                                <option value="Digital Creative Marketing">Digital Creative Marketing</option>
                                <option value="Driver/ Maintenance">Driver/ Maintenance</option>
                                <option value="Front-end Developer">Front-end Developer</option>
                                <option value="Full Stack Developer">Full Stack Developer</option>
                                <option value="Guest">Guest</option>
                                <option value="HR and Recruitment Assistant">HR and Recruitment Assistant</option>
                                <option value="HR Consultant">HR Consultant</option>
                                <option value="Intern">Intern</option>
                                <option value="Internal Finance">Internal Finance</option>
                                <option value="IT Administrator">IT Administrator</option>
                                <option value="Junior Full Stack Developer">Junior Full Stack Developer</option>
                                <option value="Lead UI/UX Designer">Lead UI/UX Designer</option>
                                <option value="Liaison Officer">Liaison Officer</option>
                                <option value="Logistics">Logistics</option>
                                <option value="Logistics Assistant">Logistics Assistant</option>
                                <option value="Maintenance Worker">Maintenance Worker</option>
                                <option value="PMO Manager">PMO Manager</option>
                                <option value="Principal Development Supervisor">Principal Development Supervisor</option>
                                <option value="Product Design Manager">Product Design Manager</option>
                                <option value="Product Owner">Product Owner</option>
                                <option value="Project Coordinator">Project Coordinator</option>
                                <option value="Project Manager">Project Manager</option>
                                <option value="QA Manager">QA Manager</option>
                                <option value="Quality Assurance Specialist">Quality Assurance Specialist</option>
                                <option value="Quality Assurance Specialist - Team Lead">Quality Assurance Specialist - Team Lead</option>
                                <option value="Quality Automation Supervisor">Quality Automation Supervisor</option>
                                <option value="Scrum Master">Scrum Master</option>
                                <option value="Scrum Master/Product Owner">Scrum Master/Product Owner</option>
                                <option value="Software Development Manager">Software Development Manager</option>
                                <option value="Sr. Full Stack Developer">Sr. Full Stack Developer</option>
                                <option value="TVI Head">TVI Head</option>
                                <option value="UI/UX Designer">UI/UX Designer</option>
                            </select>
                            <div class="custom-arrow">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
                                <path d="M9 11.25L5.25 7.5H12.75L9 11.25Z" fill="#464646"/>
                                </svg>
                            </div>  
                        </div>
                     </div>
    
                     <div class = "branch-RFID-container">
                        <div class = "branch-container">
                            <p>Branch</p>
                            <div class ="drop-down">
                                <select id="addBranch" formControlName="branch" name="branchDropDown">
                                    <option value="" disabled selected>Select Branch</option>
                                    <option value="Cebu">Cebu</option>
                                    <option value="Davao">Davao</option>
                                  </select>
                                  
                                <div class="custom-arrow">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
                                    <path d="M9 11.25L5.25 7.5H12.75L9 11.25Z" fill="#464646"/>
                                    </svg>
                                </div>  
                            </div>
                        </div>
                        <div class="rfid-container">
                            <p>RFID Card</p>
                            <div class="input-wrapper">
                              <input type="text" id="addRFID" formControlName="rfidtag" name="rfid" placeholder="Click Here" >
                              <svg class="rfid-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="18" viewBox="0 0 16 18" fill="none">
                                <path opacity="0.4" d="M14.4392 7.83165L13.7859 10.9667C13.2259 13.6742 12.1192 14.7692 10.0392 14.5442C9.70585 14.5142 9.34585 14.4467 8.95918 14.3417L7.83918 14.0417C5.05918 13.2992 4.19918 11.7542 4.85252 8.61915L5.50585 5.47665C5.63918 4.83915 5.79918 4.28415 5.99918 3.82665C6.77918 2.01165 8.10585 1.52415 10.3325 2.11665L11.4459 2.40915C14.2392 3.14415 15.0925 4.69665 14.4392 7.83165Z" fill="#B4B4B4"/>
                                <path d="M10.0391 14.5427C9.6258 14.8577 9.1058 15.1202 8.47246 15.3527L7.41913 15.7427C4.77246 16.7027 3.37913 15.9002 2.51913 12.9227L1.6658 9.96017C0.812462 6.98267 1.51913 5.40766 4.1658 4.44766L5.21913 4.05766C5.49246 3.96016 5.75246 3.87766 5.99913 3.82516C5.79913 4.28266 5.63913 4.83766 5.5058 5.47517L4.85246 8.61766C4.19913 11.7527 5.05913 13.2977 7.83913 14.0402L8.95913 14.3402C9.3458 14.4452 9.7058 14.5127 10.0391 14.5427Z" fill="#B4B4B4"/>
                              </svg>
                            </div>
                          </div>
                                                
                    </div>
    
                    <div class = "fingerprint-1-container">
                        <p><span class = "notRequired">*</span> Fingerprint Template 1</p>
                        <input type="text" id="addFinger-1" name="fingerprint-1" placeholder="Fingerprint Code">
                    </div>
    
                </div>
            <!-- end of left div -->
    
            <!-- start of right div -->
    
                <div class = "modal-content-right">
                    <div class = "email-container">
                        <p>Email</p>
                        <input type="text" id="addEmail" formControlName="email" name="email" placeholder="Input Email">
                     </div>
                     <div class = "contact-container">
                        <p>Contact</p>
                        <input type="text" id="addContact" formControlName="phone"name="contact" placeholder="+63 XXX XXX XXXX">
                    </div>
                    <div class="fingerprint-id-container">
                        <div class="fingerprint-id-1">
                          <p>Fingerprint ID 1</p>
                          <input 
                            type="text" 
                            id="finger-id-1" 
                            name="finger-1" 
                            placeholder="Biometric ID"
                            formControlName="fingerprint1"
                          >
                        </div>
                        <div class="fingerprint-id-2">
                          <p>Fingerprint ID 2</p>
                          <input 
                            type="text" 
                            id="finger-id-2" 
                            name="finger-2" 
                            placeholder="Biometric ID"
                            formControlName="fingerprint2"
                          >
                        </div>
                      </div>
                      
    
                    <div class = "fingerprint-2-container">
                        <p><span class = "notRequired">*</span>Fingerprint Template 2</p>
                        <input type="text" id="addFinger-2" name="fingerprint-2" placeholder="Fingerprint Code">
                    </div>
                </div>
                </div>
            </form>
                <div class = "footer">
                    <button class="btn clear-btn" type = "button">Cancel</button>
                    <button class="btn submit-btn" 
                
                    [ngStyle]="{'background-color': '#2165C999'}">Save Changes </button>
                </div>
            </div>
        </div>
    </body>
