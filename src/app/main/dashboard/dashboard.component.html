<div class="content1">
    <div class="total-registered">
        <span>Total Registered</span>
    </div>
    <div class="logins-today pointer" >
      <span>Logins Today</span>
      <!-- <div class="count">{{ LoginsToday }}</div> -->
    </div>
    <div class="not-on-site">
      <span>Not on site</span>
      <!-- <div class="count">{{ NotOnSite }}</div> -->
    </div>
    <div class="total pointer" >
      <span>Unregistered</span>
      <!-- <div class="count">{{ noBio }}</div> -->
    </div>
    <div class="unathorized-bio">
        <span>Unathorized Bio</span>
    </div>
</div>

<div class="content2">
    <div class="overview-label">
        <p>Overview</p>
        <span>View of all Employees Summary Result, Recent Login and Previous Attendance.</span>
    </div>

    <div class="recent-login">
        <app-recent-login></app-recent-login>
    </div>

    <div class="security-summary">
        <app-security-summary (loadingChange)="onLoadingChange($event)"></app-security-summary>
    </div>

    <div class="recent-alerts">
        <span>Previous Login</span>
        <app-recent-alerts></app-recent-alerts>
    </div>
    
</div>

<div [ngClass]="{'fade-out': !loading}" class="loading-overlay">
    <div class="jairo-container">
        <div class="jairoLoading">Jairosoft EINGRESS</div>
        <div class="spinner"></div>
    </div>
</div>
