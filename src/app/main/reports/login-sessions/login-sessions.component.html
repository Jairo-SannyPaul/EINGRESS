<div class="table">
  <div class="table-header">
    <div class="day-header">Day</div>
    <div class="date-header">Date</div>
    <div class="time-header">Time</div>
  </div>
  
    <div class="table-body">
      <div *ngIf="loginSessions && loginSessions.length > 0; else noLoginSessions">
        <div class="session" *ngFor="let session of loginSessions">
          <div class="day">
            <p>{{ getDayOfWeek(session.date) }}</p> <!-- Display day of the week -->
          </div>
          <div class="date">
            <p>{{ session.date }}</p>
          </div>
          <div class="time">
            <p>{{ session.time }}</p>
          </div>
        </div>
      </div>
      <ng-template #noLoginSessions>
        <div class="no-login">
          No Logins Yet
        </div>
      </ng-template>
    </div>
  </div>
