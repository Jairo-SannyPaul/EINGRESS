<div class="table">
  <div class="table-header">
    <div class="user-header">User</div>
    <div class="role-header">Role</div>
  </div>

  <div class="table-body pointer">
    <ng-container *ngIf="employees.length > 0; else noEmployees">
      <div *ngFor="let employee of filteredEmployees" 
           class="user" 
           [class.selected]="employee === selectedEmployee"
           (click)="selectEmployee(employee)">
        <div class="user-content">
          <div class="profile-image-container">
            <img [src]="baseUrl + '/profile-image/' + employee.profileImage" alt="Profile Image"
              [ngClass]="{'no-bio-border': !hasBio(employee), 'bio-border': hasBio(employee)}">
            <div [ngClass]="{'active-indicator': isActiveToday(employee), 'inactive-indicator': !isActiveToday(employee)}"></div>
          </div>
            <div class="name-email">
                <div class="username">{{ employee.fullname }}</div>
                <div class="useremail">{{ employee.email }}</div>
            </div>
        </div>
        <div class="role-content">{{ employee.role }}</div>
      </div>
    </ng-container>
    <ng-template #noEmployees>
      <div class="no-match-container">
        <div class="no-match-icon">🔍</div>
        <div class="no-match-message">No matching results found</div>
      </div>
    </ng-template>
  </div>
</div>
