<div class="contents">
  <div class="users-list">

    <div *ngIf="filterToggle" @slideIn class="filterTab">
      <div class="searchBy">
        <span>Search by:</span> 
        <div>
        <button class="filter name" [ngClass]="{'active-filter': selectedReportsFilter === 'name'}"
          (click)="selectName()">Name</button>
        <button class="filter role" [ngClass]="{'active-filter': selectedReportsFilter === 'role'}"
          (click)="selectRole()">Role</button>
        <button class="filter rfid" [ngClass]="{'active-filter': selectedReportsFilter === 'rfid'}"
          (click)="selectRfid()">RFID</button>
        <button class="filter fingerprint" [ngClass]="{'active-filter': selectedReportsFilter === 'fingerprint'}"
          (click)="selectFingerprint()">Fingerprint</button>
        <button class="filter branch" [ngClass]="{'active-filter': selectedReportsFilter === 'branch'}"
          (click)="selectBranch()">Branch</button>
        </div>
      </div>
      <div class="sortBy">
        <select [(ngModel)]="sortOption" (change)="onSortChange()">
          <option value="nameAsc">Sort by Name (A-Z)</option>
          <option value="nameDsc">Sort by Name (Z-A)</option>
          <option value="roleAsc">Sort by Role (A-Z)</option>
          <option value="roleDsc">Sort by Role (Z-A)</option>
          <option value="branchAsc">Sort by Branch (A-Z)</option>
          <option value="branchDsc">Sort by Branch (Z-A)</option>
          <option value="logAsc">Sort by Last Log (Recent)</option>
          <option value="bio">Has Registered Bio</option>
          <option value="noBio">No Registered Bio</option>
        </select>
      </div>
    </div>


    <app-table1 [employees]="filteredEmployees" (employeeSelected)="handleEmployeeSelected($event)"
      [filterToggle]="filterToggle">
    </app-table1>


  </div>
  <div class="user-details">
    <app-user-details [selectedEmployee]="selectedEmployee">
    </app-user-details>
  </div>
  <div class="login-sessions">
    <div class="login-sessions-text">
      <h1>Login Sessions</h1>
    </div>
    
    <!--<strong id="login-sessions-text">Login Sessions</strong>-->
    <app-login-sessions [loginSessions]="loginSessions"></app-login-sessions>
  </div>

  <div [ngClass]="{'fade-out': !loading}" class="loading-overlay">
    <div class="jairo-container">
      <div class="jairoLoading">Jairosoft EINGRESS</div>
      <div class="spinner"></div>
    </div>
  </div>
</div>
