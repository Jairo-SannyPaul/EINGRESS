<div class="main-container">
    <div class="photoholder" (click)="navigateToEmployeeDetails()">
        <img [src]="getProfileImage(selectedEmployee)" alt="Profile Image">
    </div>

    <div class="right-container" *ngIf="selectedEmployee">
        <div class="left-user-details">
            <div class="user-name" (click)="navigateToEmployeeDetails()">
                <img src="assets/images/employee-name.svg" alt="">
                <span>{{ selectedEmployee.fullname }}</span>
            </div>
            <div class="user-role">
                <img src="assets/images/employee-role.svg" alt="">
                <span>{{ selectedEmployee.role }}</span>
            </div>
        </div>
        
        <div class="right-user-details">
            <div class="user-email">
                <img src="/assets/images/employee-email.svg" alt="">
                <span>{{ selectedEmployee.email }}</span>
            </div>
            <div class="user-contact">
                <img src="/assets/images/employee-number.svg" alt="">
                <span>{{ selectedEmployee.phone }}</span>
            </div>
        </div>
    </div>
</div>
