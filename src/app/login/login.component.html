<div class="container">

    <div class="login-eingress-bckgrnd">
        <img  src="/assets/images/login-eingress-bckgrnd.png" alt="">
    </div>

    <div class="login-container">

        <div class="jairo-eingress">
            <img src="/assets/images/jairo-logo.png" alt="">
            <p>JAIROSOFT EINGRESS</p>
        </div>

        <div class="banner">
            <h2>Welcome Admin</h2>
            <p>Please enter your credentials to access your account</p>
        </div>

        <form [formGroup]="form" class="login-form">  

            <div class="login-input">
                <input formControlName="username" class="form-control" type="text" placeholder="Username" (focus)="clearText($event)" (blur)="resetPlaceholder($event)" required>
                <div class="password-container">
                    <input formControlName="password" class="form-control" [type]="showPassword ? 'text' : 'password'" placeholder="Password" (focus)="clearText($event)" (blur)="resetPlaceholder($event)">
                    <img [src]="showPassword ? '/assets/images/show-password.png' : '/assets/images/hide-password.png'" alt="Toggle Password Visibility" id="show-icon" (click)="togglePasswordVisibility('password')" required>
                </div>                
                <div class="remember-me">
                    <input type="checkbox" name="remember" id="remember"> 
                    <label for="remember" class="remember">Remember me</label>
                </div>    
            </div>   

            <button (click)="submitCredentials()">Login</button>

        </form>

    </div>    
</div>
