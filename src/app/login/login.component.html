<div class="relative h-screen w-full">
  <!-- Background Image -->
  <div class="absolute left-0 top-0 bottom-0 w-1/2 bg-white">
    <!-- Centering Container Inside White Background -->
    <div class="flex items-center justify-center h-full">
      <!-- Content -->
      <div class="absolute top-[120px] bg-white rounded-lg w-[512px] h-[572px]">
        <!-- Logo -->
        <div class="flex items-center mb-[126px]">
          <img src="/assets/images/jairo-logo.png" class="h-9" alt="Jairo Logo">
          <p class="text-[#6E6E6E] text-sm ml-3 font-semibold text-[15px] leading-[22.5px] tracking-[20%]">J A I R O S O F T</p>
          <p class="text-[#6E6E6E] text-sm ml-3 font-semibold text-[15px] leading-[22.5px] tracking-[20%]">E I N G R E S S</p>
        </div>

        <!-- Banner -->
        <div class="mb-[79px] text-left">
          <h2 class="text-[#464646] text-2xl mb-[12px] font-semibold">Log in.</h2>
          <!-- Conditionally display error message or instructions -->
          <p *ngIf="errorMessage" class="text-[#DB3956] rounded relative">
            <span class="font-normal">Your email or password was not recognized.</span>
            <br>
            <span class="block mt-2">Please try again.</span>
          </p>
          <p *ngIf="!errorMessage" class="text-[#6E6E6E] text-sm">Log in with your data that you entered during registration.</p>
        </div>

        <!-- Form -->
        <form [formGroup]="form" class="space-y-10">
          <div class="space-y-12">
            <!-- Username Field -->
            <div class="relative flex items-center mb-[32px]" 
                  [ngStyle]="{
                    'border-bottom': errorMessage ? '2px solid #DB3956' : '2px solid #6E6E6E'
                    }">
              <input 
                formControlName="username" 
                id="username" 
                class="peer bg-white text-[#6E6E6E] h-[33px] w-full outline-none placeholder-transparent" 
                type="text" 
                placeholder="Email" 
                (focus)="clearText($event)" 
                (blur)="resetPlaceholder($event)" 
                required>
              <label 
                for="username" 
                class="absolute text-[15px] top-1/2 transform -translate-y-1/2 text-[#6E6E6E] transition-all duration-300 peer-placeholder-shown:text-[#6E6E6E] peer-focus:-top-5 peer-focus:text-[#6E6E6E]"
                [class.-top-5]="form.controls['username'].value">
                Email
              </label>
              <img 
                src="/assets/images/Email-icon.svg" 
                class="absolute right-0 top-1/2 transform -translate-y-1/2" 
                alt="Email Icon">
            </div>
            
            <div class="relative flex items-center mb-[32px]" 
                  [ngStyle]="{
                    'border-bottom': errorMessage ? '2px solid #DB3956' : '2px solid #6E6E6E'
                  }">
              <input 
                formControlName="password" 
                id="password" 
                class="peer bg-white text-[#6E6E6E] h-[33px] w-full outline-none placeholder-transparent" 
                [type]="showPassword ? 'text' : 'password'" 
                placeholder="Password" 
                (focus)="clearText($event)" 
                (blur)="resetPlaceholder($event)">
              <label 
                for="password" 
                class="absolute text-[15px] top-1/2 transform -translate-y-1/2 text-[#6E6E6E] transition-all duration-300 peer-placeholder-shown:text-[#6E6E6E] peer-focus:text-[#6E6E6E] peer-focus:-top-5"
                [class.-top-5]="form.controls['password'].value">
                Password
              </label>
              <img 
                [src]="showPassword ? '/assets/images/unlock-icon.svg' : '/assets/images/Lock-icon.svg'" 
                class="absolute right-0 top-1/2 transform -translate-y-1/2 cursor-pointer" 
                alt="Toggle Password Visibility" 
                id="show-icon" 
                (click)="togglePasswordVisibility()">
            </div>
            
            <!-- Remember Me and Forgot Password -->
            <div class="flex items-center text-sm text-white space-x-2 mb-[31px] mt-[32px]">
              <input type="checkbox" name="remember" id="remember" class="mr-2"> 
              <label for="remember" class="cursor-pointer text-[#6E6E6E]">Remember me</label>
              <label for="forgot" class="cursor-pointer text-[#1D32A3] absolute right-0 font-normal">Forgot Password?</label>
            </div>
          </div>
          <button (click)="submitCredentials()" 
                  [ngClass]="{'bg-[rgba(19,50,94,1)]': isButtonActive, 'bg-[rgba(19,50,94,0.6)]': !isButtonActive}" 
                  class="w-full py-3 text-white rounded-lg font-semibold flex items-center justify-center">
            <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-0" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-100" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span [ngStyle]="{'font-weight': '400', 'font-size': '15px', 'line-height': '22.5px'}">{{ isLoading ? 'Logging in...' : 'Login' }}</span>
          </button>          
        </form>          
      </div>
    </div>
  </div>

  <!-- Background Image -->
  <img src="/assets/images/BG_Login.svg" class="absolute right-0 top-0 bottom-0 object-cover w-1/2 h-full" alt="Background Image">
</div>
